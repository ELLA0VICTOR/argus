<!doctype html>
<html lang="en" class="intro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preload" as="image" href="/img/hero-dawn.webp" type="image/webp" />
    <meta name="description" content="Crypto has no undo. Argus gives it 24 hours. A self-custodial Solana vault with a cancellable delay and an AI guardian that calls you." />
    <title>Argus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Intro splash. Plain HTML/CSS, so it paints before any JS runs, on every
         load. main.tsx removes it after ~3.5s, once the app has rendered. */
      html, body { background: #ffffff; }
      #splash {
        position: fixed; inset: 0; z-index: 100; background: #ffffff;
        display: grid; place-items: center; color: #16191f;
        transition: opacity 520ms cubic-bezier(0.16, 1, 0.3, 1), transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* Page entrance animations wait for the splash to lift. */
      .intro .enter, .intro .reveal { animation-play-state: paused; }
      #splash.out { opacity: 0; transform: scale(1.015); pointer-events: none; }
      #splash .wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #splash svg .tri, #splash svg .eye { stroke-dasharray: 120; stroke-dashoffset: 120; animation: s-draw 1200ms cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      #splash svg .eye { animation-delay: 400ms; }
      #splash svg .pupil { transform-origin: 20px 24.5px; transform: scale(0); animation: s-pupil 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 1600ms forwards; }
      #splash svg .look { animation: s-look 900ms cubic-bezier(0.45, 0, 0.55, 1) 2400ms both; }
      #splash .word { display: flex; gap: 0.32em; font-family: "EB Garamond", "Times New Roman", serif; font-weight: 500; font-size: 34px; letter-spacing: 0.02em; gap: 0.04em; padding-left: 0; }
      #splash .word span { opacity: 0; transform: translateY(10px); animation: s-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      #splash .word span:nth-child(1) { animation-delay: 1100ms; }
      #splash .word span:nth-child(2) { animation-delay: 1190ms; }
      #splash .word span:nth-child(3) { animation-delay: 1280ms; }
      #splash .word span:nth-child(4) { animation-delay: 1370ms; }
      #splash .word span:nth-child(5) { animation-delay: 1460ms; }
      #splash .bar { width: 132px; height: 2px; border-radius: 2px; background: #e4e8ef; overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 100%; background: #2563eb; transform: scaleX(0); transform-origin: left; animation: s-bar 3000ms cubic-bezier(0.65, 0, 0.35, 1) 300ms forwards; }
      @keyframes s-draw { to { stroke-dashoffset: 0; } }
      @keyframes s-pupil { to { transform: scale(1); } }
      @keyframes s-rise { to { opacity: 1; transform: none; } }
      @keyframes s-bar { to { transform: scaleX(1); } }
      @keyframes s-look { 0%, 100% { transform: translateX(0); } 30%, 45% { transform: translateX(-2.6px); } 65%, 80% { transform: translateX(2.6px); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="wrap">
        <svg width="64" height="64" viewBox="0 0 40 40" fill="none">
          <path class="tri" d="M20 4.5 L35.5 34.5 H4.5 Z" stroke="#16191f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          <path class="eye" d="M11 24.5 Q20 16.5 29 24.5 Q20 32.5 11 24.5 Z" stroke="#16191f" stroke-width="1.8" stroke-linejoin="round" />
          <g class="look"><circle class="pupil" cx="20" cy="24.5" r="3" fill="#16191f" /></g>
        </svg>
        <div class="word"><span>A</span><span>r</span><span>g</span><span>u</span><span>s</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
